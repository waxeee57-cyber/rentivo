<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 349 89" width="349" height="89">
  <!--
    Rentivo horizontal lockup. Mark + wordmark + the accent full stop.

    The stop is not decoration: the brand line is "Rent anything." and the
    period is the confidence in it. It is also the ONLY place the accent
    colour appears, which is the same rule the app follows everywhere else.

    The type is OUTLINED, not <text font-family="Manrope">. Live text is
    exactly what made the previous gold-R icon unshippable - it rendered
    differently, or not at all, wherever the font was missing. Set in Manrope
    ExtraBold, -2.6 tracking, kerned from the font's own kern table.

    Geometry is derived, not eyeballed: the mark is 1.28x the measured cap
    height, mark and type sit on the SAME baseline, and the left margin is the
    mark's ink EDGE, not its centre (centring it there pushed 16.5 units of
    stroke outside the viewBox and sliced the bowl off).

    Recolour by setting --rentivo-ink / --rentivo-accent; the hex values are
    fallbacks for renderers without CSS variable support.
  -->
  <g transform="translate(33.68 44.41) scale(0.7156) translate(-52.0 -50.0)">
    
  <g fill="none" stroke="var(--rentivo-ink, #0A1628)" stroke-width="13"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- stem -->
    <path d="M 31 14 L 31 86"/>
    <!-- bowl: narrow, so the counter stays open at 16px. Ends at 46, a hair
         above optical centre, or the letter reads bottom-heavy. -->
    <path d="M 31 14 L 54 14 A 16 16 0 0 1 54 46 L 31 46"/>
    <!-- leg: a decisive diagonal that CLEARS the stem, then a short inward
         terminal at the foot. The earlier version curved back until it met the
         stem and closed a second bowl - the mark read as a B. The return
         gesture has to stay open or it eats the letter. -->
    <path d="M 52 46 L 72 79 C 74 83 71 86 67 84"/>
  </g>
  </g>
