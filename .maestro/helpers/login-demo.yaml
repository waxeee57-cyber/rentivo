# Reusable helper: Consumer onboarding skip + elér explore-ra
# Feltétel: launchApp clearState:true már megtörtént a szülő flow-ban
# Eredmény: consumer Explore képernyőn vagyunk (vendég mód)
#
# Használat a szülő flow-ban:
#   - runFlow:
#       file: ../helpers/login-demo.yaml
appId: com.domrol.rentivo
---
# Cold clearState launch against a live Metro dev server re-fetches the full
# JS bundle (~2800 modules, 20-25s on this machine) before anything renders —
# far past Maestro's default assertVisible timeout. extendedWaitUntil below
# absorbs that cold-start cost; a release/embedded-bundle build wouldn't need it.
- extendedWaitUntil:
    visible:
      text: "Accept & Continue"
    timeout: 45000
    optional: true
# Privacy/GDPR consent modal — shows once on genuinely fresh AsyncStorage
# (i.e. after clearState:true). Handled defensively in case it doesn't fire
# (e.g. state wasn't actually cleared).
- runFlow:
    when:
      visible:
        text: "Accept & Continue"
    commands:
      - tapOn:
          text: "Accept & Continue"
      - waitForAnimationToEnd
# Measured 2026-08-04: cold start (pm clear -> first UI) is 16.2s against a warm
# Metro. 45s was still enough on paper, but this screen is the heaviest render in
# the app and it flaked 1-in-20 under the sustained emulator load of a full
# 20-flow run on a software GPU. 90s costs nothing when the assertion passes.
- extendedWaitUntil:
    visible:
      text: "Rent anything."
    timeout: 90000
- tapOn:
    text: "Skip"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Explore"
    timeout: 15000
