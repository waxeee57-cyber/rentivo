appId: com.domrol.rentivo
name: "03 — Login: Demo host bejelentkezés"
tags:
  - smoke
  - regression
---
# Teszteli: Onboarding → Host role → Host listings képernyő

- launchApp:
    clearState: true
- waitForAnimationToEnd

# Privacy/GDPR consent modal - shows once on genuinely fresh AsyncStorage
- extendedWaitUntil:
    visible:
      text: "Accept & Continue"
    timeout: 45000
    optional: true
- runFlow:
    when:
      visible:
        text: "Accept & Continue"
    commands:
      - tapOn:
          text: "Accept & Continue"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "Rent anything."
    timeout: 45000
- tapOn:
    text: "Get started →"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "How it works"
    timeout: 15000
- tapOn:
    text: "Next →"
- waitForAnimationToEnd

# Screen3: Host role kiválasztása
- extendedWaitUntil:
    visible:
      text: "I own something to rent"
    timeout: 15000
- tapOn:
    text: "I own something to rent"
- waitForAnimationToEnd

# Host listings képernyőn vagyunk
- extendedWaitUntil:
    visible:
      text: "Your vehicles"
    timeout: 15000
- assertNotVisible:
    text: "Render Error"

- takeScreenshot: "03-host-listings-reached"
