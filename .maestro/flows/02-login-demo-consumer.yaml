appId: com.domrol.rentivo
name: "02 — Login: Demo consumer bejelentkezés"
tags:
  - smoke
  - critical
---
# Teszteli: Onboarding → role card → Consumer Explore közvetlen elérés
# A OnboardingFlow Screen3 tapping role navigál session nélkül

- launchApp:
    clearState: true
- waitForAnimationToEnd

# Privacy/GDPR consent modal — shows once on genuinely fresh AsyncStorage
- extendedWaitUntil:
    visible:
      text: "Accept & Continue"
    timeout: 45000
    optional: true
- runFlow:
    when:
      visible:
        text: "Accept & Continue"
    commands:
      - tapOn:
          text: "Accept & Continue"
      - waitForAnimationToEnd

# Screen1
- extendedWaitUntil:
    visible:
      text: "Rent anything."
    timeout: 45000
- tapOn:
    text: "Get started →"
- waitForAnimationToEnd

# Screen2: How it works
- extendedWaitUntil:
    visible:
      text: "How it works"
    timeout: 15000
- tapOn:
    text: "Next →"
- waitForAnimationToEnd

# Screen3: Role selection
- extendedWaitUntil:
    visible:
      text: "How will you use.*"
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: "I want to rent something"
    timeout: 15000
- tapOn:
    text: "I want to rent something"
- waitForAnimationToEnd

# Explore képernyőn vagyunk
- extendedWaitUntil:
    visible:
      text: "Explore"
    timeout: 15000
- assertNotVisible:
    text: "Render Error"

- takeScreenshot: "02-consumer-explore-reached"
