appId: com.domrol.rentivo
name: "14 — Profil: Nyelv váltás EN→HU→EN"
tags:
  - regression
---
# Teszteli: Nyelv váltás HU-ra megváltoztatja a UI szövegeket
# setLanguage store frissül, tab bar és képernyők lokalizálva
# A nyelvi chipek teljes szövege "🇬🇧 EN" / "🇭🇺 HU" — pontos matchet használunk,
# mert a ".*EN.*" regex a "MEGJELENÉS" szekciócímre is illeszkedne.

- launchApp:
    clearState: true
- runFlow:
    file: ../helpers/login-demo.yaml

- extendedWaitUntil:
    visible:
      text: "Explore"
    timeout: 15000

- tapOn:
    text: "Profile"
- waitForAnimationToEnd

- assertVisible:
    text: "Profile"

# Scroll a Language szekcióhoz
- scrollUntilVisible:
    element:
      text: "HU"
    direction: DOWN
    timeout: 30000

# Magyar váltás
- tapOn:
    text: "HU"
- waitForAnimationToEnd

# Tab bar HU-ra vált
- assertVisible:
    text: ".*Felfedez.*"

# Visszaváltás EN-re
- scrollUntilVisible:
    element:
      text: "EN"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "EN"
- waitForAnimationToEnd

# Tab bar visszaállt EN-re
- extendedWaitUntil:
    visible:
      text: "Explore"
    timeout: 15000

- takeScreenshot: "14-language-switch-done"
