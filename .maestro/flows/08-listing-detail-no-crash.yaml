appId: com.domrol.rentivo
name: "08 — Listing Detail: Nem crashel (P0 kritikus)"
tags:
  - smoke
  - critical
---
# KRITIKUS FLOW: listing/[id].tsx hook bug volt (hasonló listings crash)
# Ez a teszt bizonyítja, hogy a listing detail NEM crashel betöltés után
# A P0 javítás után: useAvailability és hasonló hook-ok nem dobnak hibát

- launchApp:
    clearState: true
- runFlow:
    file: ../helpers/login-demo.yaml

# Explore képernyőn vagyunk
- extendedWaitUntil:
    visible:
      text: "Explore"
    timeout: 15000

# Lista nézetbe váltás hogy kártyák legyenek kattinthatóak
- extendedWaitUntil:
    visible:
      text: "Explore"
    timeout: 5000

# Várjuk a listing betöltést
- extendedWaitUntil:
    notVisible:
      text: "Loading"
    timeout: 8000

# Az első elérhető listing kártyára tappolunk
# Ha map nézetben vagyunk, lapozzunk le a preview-ra
- scrollUntilVisible:
    element:
      id: "listing-card"
    direction: DOWN
    timeout: 8000

# Listing card tap a kártya testID-jével.
# ELŐTTE: `text: ".*€.*"` — "az első euró-jeles szöveg a képernyőn". Ez néma
# módon átcélzott egy nem-kattintható ár-feliratra, amint a feed fölé került
# egy "From €25/day" horgony: a flow egy <Text>-re koppintott, sosem jutott el
# a detail képernyőre, és a hiba úgy jelentkezett, mintha a Book gomb tűnt
# volna el. A szándékra célzunk, nem a szövegre.
- tapOn:
    id: "listing-card"
- waitForAnimationToEnd

# 3 másodperc várakozás — ez volt a crash window
- extendedWaitUntil:
    visible:
      text: "Select dates|Book now"
    timeout: 5000

# KRITIKUS ASSERTEK
- assertNotVisible:
    text: "Render Error"
- assertNotVisible:
    text: "Something went wrong"
- assertNotVisible:
    text: "null is not an object"

# Hero és ár látható
- assertVisible:
    text: "Select dates|Book now"

# Scroll le — similar listings renderelés (ez volt a hook crash forrása)
- scroll
- scroll
- scroll
- waitForAnimationToEnd

# Még mindig nincs crash
- assertNotVisible:
    text: "Render Error"
- assertNotVisible:
    text: "Similar vehicles"

- takeScreenshot: "08-listing-detail-no-crash"
