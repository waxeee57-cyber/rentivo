appId: com.domrol.rentivo
name: "16 — Host: Új listing létrehozása (wizard indítás)"
tags:
  - smoke
  - regression
---
# Teszteli: Host → My Listings → "+ Add listing" → wizard 1. lépés

- launchApp:
    clearState: true
- waitForAnimationToEnd

# Privacy/GDPR consent modal - shows once on genuinely fresh AsyncStorage
- extendedWaitUntil:
    visible:
      text: "Accept & Continue"
    timeout: 45000
    optional: true
- runFlow:
    when:
      visible:
        text: "Accept & Continue"
    commands:
      - tapOn:
          text: "Accept & Continue"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "Rent anything."
    timeout: 45000
- tapOn:
    text: "Get started →"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "How it works"
    timeout: 15000
- tapOn:
    text: "Next →"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "I own something to rent"
    timeout: 15000
- tapOn:
    text: "I own something to rent"
- waitForAnimationToEnd

# Host listings főképernyő
- extendedWaitUntil:
    visible:
      text: "Your vehicles"
    timeout: 15000

# Nincs crash
- assertNotVisible:
    text: "Render Error"

# Új listing gomb
- tapOn:
    text: "List my vehicle.*"
- waitForAnimationToEnd

# Wizard 1. lépés — kategória választó
- assertVisible:
    text: "What are you renting?"

# Kategória kártyák láthatók
- assertNotVisible:
    text: "Render Error"

# Progress indicator látható
- assertNotVisible:
    text: "Something went wrong"

- takeScreenshot: "16-host-new-listing-wizard"
