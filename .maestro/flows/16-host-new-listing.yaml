appId: com.domrol.rentivo
name: "16 — Host: Új listing létrehozása (wizard indítás)"
tags:
  - smoke
  - regression
---
# Teszteli: Host → My Listings → "+ Add listing" → wizard 1. lépés

- launchApp:
    clearState: true
- waitForAnimationToEnd

- assertVisible:
    text: "Rent anything."
- tapOn:
    text: "Get started →"
- waitForAnimationToEnd

- assertVisible:
    text: "How it works"
- tapOn:
    text: "Next →"
- waitForAnimationToEnd

- assertVisible:
    text: "I own something to rent"
- tapOn:
    text: "I own something to rent"
- waitForAnimationToEnd

# Host listings főképernyő
- assertVisible:
    text: "My Listings"

# Nincs crash
- assertNotVisible:
    text: "Render Error"

# Új listing gomb
- tapOn:
    text: "Add listing"
- waitForAnimationToEnd

# Wizard 1. lépés — kategória választó
- assertVisible:
    text: "What are you listing?"

# Kategória kártyák láthatók
- assertNotVisible:
    text: "Render Error"

# Progress indicator látható
- assertNotVisible:
    text: "Something went wrong"

- takeScreenshot: "16-host-new-listing-wizard"
