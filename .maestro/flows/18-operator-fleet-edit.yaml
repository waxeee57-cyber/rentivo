appId: com.domrol.rentivo
name: "18 — Operator: Fleet kártya megnyitás"
tags:
  - regression
---
# Teszteli: Operator → Fleet tab → fleet kártya tap → szerkesztő form megnyílik

- launchApp:
    clearState: true
- waitForAnimationToEnd

# Privacy/GDPR consent modal - shows once on genuinely fresh AsyncStorage
- extendedWaitUntil:
    visible:
      text: "Accept & Continue"
    timeout: 45000
    optional: true
- runFlow:
    when:
      visible:
        text: "Accept & Continue"
    commands:
      - tapOn:
          text: "Accept & Continue"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "Rent anything."
    timeout: 45000
- tapOn:
    text: "Get started →"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "How it works"
    timeout: 15000
- tapOn:
    text: "Next →"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "I run a rental business"
    timeout: 15000
- tapOn:
    text: "I run a rental business"
- waitForAnimationToEnd

# Operator dashboard
- extendedWaitUntil:
    visible:
      text: "Dashboard"
    timeout: 15000

# Fleet tab megnyitása
- tapOn:
    text: "Fleet"
- waitForAnimationToEnd

# Fleet lista betölt
- assertVisible:
    text: "Fleet"

# Nincs crash
- assertNotVisible:
    text: "Render Error"

# Első fleet kártya tappolása (ha van)
- tapOn:
    index: 0
    optional: true
- waitForAnimationToEnd

# Szerkesztő form — ha van jármű, az edit form nyílt meg
- assertNotVisible:
    text: "Render Error"

- takeScreenshot: "18-operator-fleet-edit"
