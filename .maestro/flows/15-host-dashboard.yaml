appId: com.domrol.rentivo
name: "15 — Host: Dashboard és foglalások"
tags:
  - smoke
  - regression
---
# Teszteli: Host onboarding → Listings képernyő → tab bar működik

- launchApp:
    clearState: true
- waitForAnimationToEnd

# Privacy/GDPR consent modal - shows once on genuinely fresh AsyncStorage
- extendedWaitUntil:
    visible:
      text: "Accept & Continue"
    timeout: 45000
    optional: true
- runFlow:
    when:
      visible:
        text: "Accept & Continue"
    commands:
      - tapOn:
          text: "Accept & Continue"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "Rent anything."
    timeout: 45000
- tapOn:
    text: "Get started →"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "How it works"
    timeout: 15000
- tapOn:
    text: "Next →"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "I own something to rent"
    timeout: 15000
- tapOn:
    text: "I own something to rent"
- waitForAnimationToEnd

# Host listings főképernyő
- extendedWaitUntil:
    visible:
      text: "Your vehicles"
    timeout: 15000

# Nincs crash
- assertNotVisible:
    text: "Render Error"

# Listings tab látható
- assertNotVisible:
    text: "Something went wrong"

- takeScreenshot: "15-host-dashboard"
