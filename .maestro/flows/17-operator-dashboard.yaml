appId: com.domrol.rentivo
name: "17 — Operator: Dashboard statisztikák"
tags:
  - smoke
  - critical
---
# Teszteli: Operator belépés → Dashboard → revenue/booking stats látható

- launchApp:
    clearState: true
- waitForAnimationToEnd

# Privacy/GDPR consent modal - shows once on genuinely fresh AsyncStorage
- extendedWaitUntil:
    visible:
      text: "Accept & Continue"
    timeout: 45000
    optional: true
- runFlow:
    when:
      visible:
        text: "Accept & Continue"
    commands:
      - tapOn:
          text: "Accept & Continue"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "Rent anything."
    timeout: 45000
- tapOn:
    text: "Get started →"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "How it works"
    timeout: 15000
- tapOn:
    text: "Next →"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "I run a rental business"
    timeout: 15000
- tapOn:
    text: "I run a rental business"
- waitForAnimationToEnd

# Operator dashboard betölt
- extendedWaitUntil:
    visible:
      text: "Dashboard"
    timeout: 15000

# Bevétel kártya látható
- extendedWaitUntil:
    visible:
      text: ".*Revenue this month.*"
    timeout: 15000

# Foglalás statisztika látható
- assertVisible:
    text: "Bookings"

# Nincs crash
- assertNotVisible:
    text: "Render Error"

# Nincs render hiba
- assertNotVisible:
    text: "Something went wrong"

- takeScreenshot: "17-operator-dashboard"
