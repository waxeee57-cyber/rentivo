- tapOn:
    text: "Next →"
- waitForAnimationToEnd

- assertVisible:
    text: "I run a rental business"
- tapOn:
    text: "I run a rental business"
- waitForAnimationToEnd

# Operator dashboard betölt
- assertVisible:
    text: "Dashboard"

# Bevétel kártya látható
- assertVisible:
    text: "Revenue"

# Foglalás statisztika látható
- assertVisible:
    text: "Bookings"

# Nincs crash
- assertNotVisible:
    text: "Render Error"

# Nincs render hiba
- assertNotVisible:
