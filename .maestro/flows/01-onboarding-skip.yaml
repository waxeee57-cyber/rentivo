appId: com.domrol.rentivo
name: "01 — Onboarding: Skip gomb"
tags:
  - smoke
  - critical
---
# Teszteli: OnboardingFlow Screen1 betölt, Skip gomb navigál Explore-ra

- launchApp:
    clearState: true
- waitForAnimationToEnd

# Privacy/GDPR consent modal — shows once on genuinely fresh AsyncStorage
- extendedWaitUntil:
    visible:
      text: "Accept & Continue"
    timeout: 45000
    optional: true
- runFlow:
    when:
      visible:
        text: "Accept & Continue"
    commands:
      - tapOn:
          text: "Accept & Continue"
      - waitForAnimationToEnd

# Screen1: hero szöveg és gombok láthatóak
- extendedWaitUntil:
    visible:
      text: "Rent anything."
    timeout: 45000
- assertVisible:
    text: "Get started →"
- assertVisible:
    text: "Skip"

# Skip → közvetlenül Explore-ra (consumer guest mód)
- tapOn:
    text: "Skip"
- waitForAnimationToEnd

# Explore tab aktív
- extendedWaitUntil:
    visible:
      text: "Explore"
    timeout: 15000

# Nincs crash
- assertNotVisible:
    text: "Render Error"
- assertNotVisible:
    text: "Something went wrong"

- takeScreenshot: "01-onboarding-skip-done"
