appId: com.domrol.rentivo
name: "13 — Téma: Light/Dark toggle"
tags:
  - smoke
  - critical
---
# Teszteli: Profil oldalon a Dark mode Switch működik
# A useThemeStore isDark értéke változik, UI újrarenderelődik

- launchApp:
    clearState: true
- runFlow:
    file: ../helpers/login-demo.yaml

- assertVisible:
    text: "Explore"

# Profile tab megnyitása
- tapOn:
    text: "Profile"
- waitForAnimationToEnd

# Profile betölt
- assertVisible:
    text: "Profile"

# Scroll az Appearance szekciához
- scrollUntilVisible:
    element:
      text: "Dark mode"
    direction: DOWN
    timeout: 5000

# Dark mode switch látható
- assertVisible:
    text: "Dark mode"

# Switch tap → light módra váltás
- tapOn:
    text: "Dark mode"
- waitForAnimationToEnd

# Nincs crash, UI megmaradt
- assertVisible:
    text: "Dark mode"
- assertNotVisible:
    text: "Render Error"

# Visszaváltás dark módra
- tapOn:
    text: "Dark mode"
- waitForAnimationToEnd

# Még mindig intact a profil
- assertVisible:
    text: "Profile"
- assertNotVisible:
    text: "Render Error"

- takeScreenshot: "13-theme-toggle-done"
