appId: com.domrol.rentivo
name: "13 — Téma: Light/Dark toggle"
tags:
  - smoke
  - critical
---
# Teszteli: Profil oldalon a Dark mode Switch működik
# A useThemeStore isDark értéke változik, UI újrarenderelődik

- launchApp:
    clearState: true
- runFlow:
    file: ../helpers/login-demo.yaml

- extendedWaitUntil:
    visible:
      text: "Explore"
    timeout: 15000

# Profile tab megnyitása
- tapOn:
    text: "Profile"
- waitForAnimationToEnd

# Profile betölt
- assertVisible:
    text: "Profile"

# Scroll az Appearance szekciához
- scrollUntilVisible:
    element:
      text: ".*Dark mode.*"
    direction: DOWN
    timeout: 30000

# Dark mode switch látható
- assertVisible:
    text: ".*Dark mode.*"

# Switch tap → dark módra váltás (a Switch elemet célozzuk, nem a címkét)
- tapOn:
    text: "Toggle dark mode"
- waitForAnimationToEnd

# Nincs crash, UI megmaradt
- assertVisible:
    text: ".*Dark mode.*"
- assertNotVisible:
    text: "Render Error"

# Visszaváltás light módra
- tapOn:
    text: "Toggle dark mode"
- waitForAnimationToEnd

# Még mindig intact a profil
- assertVisible:
    text: "Profile"
- assertNotVisible:
    text: "Render Error"

- takeScreenshot: "13-theme-toggle-done"
