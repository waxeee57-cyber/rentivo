appId: com.domrol.rentivo
name: "12 — AI Asszisztens: Megnyitás és vissza navigáció"
tags:
  - smoke
  - regression
---
# Teszteli: Assistant tab megnyílik, üzenet küldhető, back navigáció működik

- launchApp:
    clearState: true
- runFlow:
    file: ../helpers/login-demo.yaml

- extendedWaitUntil:
    visible:
      text: "Explore"
    timeout: 15000

# Assistant tab
- tapOn:
    text: "Assistant"
- waitForAnimationToEnd

# Assistant képernyő
- assertVisible:
    text: "Rental Assistant"
- assertVisible:
    text: "Ask me anything about rentals"

# Welcome üzenet látható (teljes szöveg regex-szel — a Maestro full-match-el)
- assertVisible:
    text: "Hi! I am your Rentivo AI assistant.*"

# Suggestion chip tap
- tapOn:
    text: ".*Find a car in Marbella.*"
- waitForAnimationToEnd

# Üzenet megjelent
- assertVisible:
    text: ".*Find a car in Marbella.*"

# Nincs crash
- assertNotVisible:
    text: "Render Error"

# Vissza navigáció a ← gombbal
- tapOn:
    text: "Go back"
- waitForAnimationToEnd

# Visszakerültünk az Explore-ra
- extendedWaitUntil:
    visible:
      text: "Explore"
    timeout: 15000

- takeScreenshot: "12-assistant-back-nav"
