appId: com.domrol.rentivo
name: "11 — Bookings: Foglalások lista képernyő"
tags:
  - smoke
  - regression
---
# Teszteli: Bookings tab megnyílik, tab bar működik, üres state helyes

- launchApp:
    clearState: true
- runFlow:
    file: ../helpers/login-demo.yaml

- extendedWaitUntil:
    visible:
      text: "Explore"
    timeout: 15000

# My Trips tab tappolás (consumer-oldali név: Trips, nem Bookings)
- tapOn:
    text: "My Trips"
- waitForAnimationToEnd

# Bookings képernyő betölt
- assertVisible:
    text: "My Trips"

# Tab-ok láthatóak
- assertVisible:
    text: "Upcoming"

# Üres state esetén: CTA gomb látható
- assertNotVisible:
    text: "Render Error"

# Visszaváltás Explore-ra
- tapOn:
    text: "Explore"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Explore"
    timeout: 15000

- takeScreenshot: "11-bookings-list"
