appId: com.domrol.rentivo
name: "05 — Explore: Lista nézet váltás"
tags:
  - smoke
  - regression
---
# Teszteli: Explore betölt, map→lista nézet váltás működik

- launchApp:
    clearState: true
- runFlow:
    file: ../helpers/login-demo.yaml

# Explore betölt — alapértelmezett: map nézet
- extendedWaitUntil:
    visible:
      text: "Explore"
    timeout: 15000

# Keresés sor / city picker látható
- extendedWaitUntil:
    visible:
      text: "Marbella"
    timeout: 15000

# Forrás-váltó látható (a "Cars & villas…" discovery-szöveg csak üres
# listánál renderel — élő adatokkal a lista jelenik meg helyette)
- assertVisible:
    text: ".*All platforms.*"

# Lista nézetre váltás (lista ikon jobbra)
- tapOn:
    text: "≡"
    optional: true
- waitForAnimationToEnd

# Ha van listing kártyák — assertVisible a listán
- extendedWaitUntil:
    visible:
      text: "Explore"
    timeout: 5000

- assertNotVisible:
    text: "Render Error"

- takeScreenshot: "05-explore-list-view"
