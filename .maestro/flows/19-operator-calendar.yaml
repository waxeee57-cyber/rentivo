appId: com.domrol.rentivo
name: "19 — Operator: Naptár nézet"
tags:
  - smoke
  - regression
---
# Teszteli: Operator → Bookings → Calendar tab → hónap grid renderel, navigáció működik

- launchApp:
    clearState: true
- waitForAnimationToEnd

# Privacy/GDPR consent modal - shows once on genuinely fresh AsyncStorage
- extendedWaitUntil:
    visible:
      text: "Accept & Continue"
    timeout: 45000
    optional: true
- runFlow:
    when:
      visible:
        text: "Accept & Continue"
    commands:
      - tapOn:
          text: "Accept & Continue"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "Rent anything."
    timeout: 45000
- tapOn:
    text: "Get started →"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "How it works"
    timeout: 15000
- tapOn:
    text: "Next →"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "I run a rental business"
    timeout: 15000
- tapOn:
    text: "I run a rental business"
- waitForAnimationToEnd

# Operator dashboard
- extendedWaitUntil:
    visible:
      text: "Dashboard"
    timeout: 15000

# Bookings tab
- tapOn:
    text: "Bookings"
- waitForAnimationToEnd

# Bookings betölt
- assertVisible:
    text: "Bookings"

# Calendar tab switcher
- tapOn:
    text: "Calendar"
    optional: true
- waitForAnimationToEnd

# Hónap grid látható (dátum szám vagy hónapnév)
- assertNotVisible:
    text: "Render Error"

# Nincs crash
- assertNotVisible:
    text: "Something went wrong"

# Előre navigáció (következő hónap gomb)
- tapOn:
    text: "Next month"
    optional: true
- waitForAnimationToEnd

- assertNotVisible:
    text: "Render Error"

- takeScreenshot: "19-operator-calendar"
