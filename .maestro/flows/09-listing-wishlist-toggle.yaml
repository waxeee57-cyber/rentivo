appId: com.domrol.rentivo
name: "09 — Listing: Wishlist (szív) toggle"
tags:
  - regression
---
# Teszteli: Szív gomb tap wishlist-re tesz/elvesz egy listingot

- launchApp:
    clearState: true
- runFlow:
    file: ../helpers/login-demo.yaml

- assertVisible:
    text: "Explore"

# Listing megnyitása
- extendedWaitUntil:
    notVisible:
      text: "Loading"
    timeout: 8000

- scrollUntilVisible:
    element:
      text: "€"
    direction: DOWN
    timeout: 8000

- tapOn:
    text: "€"
- waitForAnimationToEnd

# Listing detail megnyílt
- extendedWaitUntil:
    visible:
      text: "Book"
    timeout: 5000

# Szív gomb tap — wishlist hozzáadás
- tapOn:
    accessibilityLabel: "Add to favorites"
    optional: true
- waitForAnimationToEnd

# Vissza az explore-ra
- back
- waitForAnimationToEnd

# Wishlist tab ellenőrzése (ha van)
- assertVisible:
    text: "Explore"
- assertNotVisible:
    text: "Render Error"

- takeScreenshot: "09-wishlist-toggle"
