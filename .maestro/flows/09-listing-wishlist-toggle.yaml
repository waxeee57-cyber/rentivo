appId: com.domrol.rentivo
name: "09 — Listing: Wishlist (szív) toggle"
tags:
  - regression
---
# Teszteli: Szív gomb tap wishlist-re tesz/elvesz egy listingot

- launchApp:
    clearState: true
- runFlow:
    file: ../helpers/login-demo.yaml

- extendedWaitUntil:
    visible:
      text: "Explore"
    timeout: 15000

# Listing megnyitása
- extendedWaitUntil:
    notVisible:
      text: "Loading"
    timeout: 8000

- scrollUntilVisible:
    element:
      id: "listing-card"
    direction: DOWN
    timeout: 8000

# testID, nem ár-regex — lásd a 08-as flow indoklását.
- tapOn:
    id: "listing-card"
- waitForAnimationToEnd

# Listing detail megnyílt
- extendedWaitUntil:
    visible:
      text: "Select dates|Book now"
    timeout: 5000

# Szív gomb tap — wishlist hozzáadás
- tapOn:
    text: "Add to favorites"
    optional: true
- waitForAnimationToEnd

# Vissza az explore-ra
- back
- waitForAnimationToEnd

# Wishlist tab ellenőrzése (ha van)
- extendedWaitUntil:
    visible:
      text: "Explore"
    timeout: 15000
- assertNotVisible:
    text: "Render Error"

- takeScreenshot: "09-wishlist-toggle"
