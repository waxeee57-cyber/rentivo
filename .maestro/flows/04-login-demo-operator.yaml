appId: com.domrol.rentivo
name: "04 — Login: Demo operator bejelentkezés"
tags:
  - smoke
  - critical
---
# Teszteli: Onboarding → Operator role → Dashboard közvetlen elérés

- launchApp:
    clearState: true
- waitForAnimationToEnd

# Privacy/GDPR consent modal - shows once on genuinely fresh AsyncStorage
- extendedWaitUntil:
    visible:
      text: "Accept & Continue"
    timeout: 45000
    optional: true
- runFlow:
    when:
      visible:
        text: "Accept & Continue"
    commands:
      - tapOn:
          text: "Accept & Continue"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "Rent anything."
    timeout: 45000
- tapOn:
    text: "Get started →"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "How it works"
    timeout: 15000
- tapOn:
    text: "Next →"
- waitForAnimationToEnd

# Screen3: Operator role
- extendedWaitUntil:
    visible:
      text: "I run a rental business"
    timeout: 15000
- tapOn:
    text: "I run a rental business"
- waitForAnimationToEnd

# Operator Dashboard
- extendedWaitUntil:
    visible:
      text: "Dashboard"
    timeout: 15000
- assertNotVisible:
    text: "Render Error"
- assertNotVisible:
    text: "Something went wrong"

- takeScreenshot: "04-operator-dashboard-reached"
